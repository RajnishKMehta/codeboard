name: Android Release CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['**']

  push:
    branches: [ main, master ]

  workflow_dispatch:

concurrency:
 group: Release
 cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate temporary keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release-key \
            -storepass "codeboard123" \
            -keypass "codeboard123" \
            -dname "CN=Codeboard, OU=Development, O=Codeboard, L=India, S=India, C=IN"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass codeboard123 \
            -keypass codeboard123 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            release-key

      - name: Find and Zipalign APK
        run: |
          BUILD_TOOLS_VERSION=$(ls ${ANDROID_SDK_ROOT}/build-tools/ | sort -V | tail -1)
          ${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 60
