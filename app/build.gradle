apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.gazlaws.codeboard"
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.gazlaws.codeboard"
        minSdkVersion 23
        targetSdk 37
        versionCode 23
        versionName "6.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    lint {
        checkReleaseBuilds false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    api 'androidx.appcompat:appcompat:1.7.1'
    api 'androidx.preference:preference:1.2.1'

    implementation 'com.google.android.material:material:1.12.0'

    //https://github.com/AppIntro/AppIntro
    implementation 'com.github.AppIntro:AppIntro:6.3.1'

    //Colour picker
    //implementation 'com.pes.materialcolorpicker:library:1.2.5'
    implementation 'com.github.evilbunny2008:android-material-color-picker-dialog:1.3.7'

    // Required for local unit tests (JUnit 4 framework)
    testImplementation 'junit:junit:4.13.2'

    // Required for instrumented tests
    implementation 'androidx.annotation:annotation:1.10.0'
    androidTestImplementation 'androidx.annotation:annotation:1.10.0'


    // Core library
    androidTestImplementation 'androidx.test:core:1.7.0'

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation 'androidx.test:runner:1.7.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

}
